
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Field States</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Input Field States</h1>

        <div class="input-row">
            <div class="number">1</div>
            <p class="state">Default</p>

            <div class="input-box">
                <label>Email address</label>
                <input type="text" placeholder="Enter email address">
            </div>
        </div>

        <div class="input-row">
            <div class="number">2</div>
            <p class="state">Hover</p>

            <div class="input-box">
                <label>Email address</label>
                <input class="hover" type="text"
                    placeholder="Enter email address">
            </div>
        </div>

        <div class="input-row">
            <div class="number">3</div>
            <p class="state">Typing</p>

            <div class="input-box">
                <label>Email address</label>
                <input class="typing" type="text" >
            </div>
        </div>

        <div class="input-row">
            <div class="number">4</div>
            <p class="state">Typed</p>

            <div class="input-box">
                <label>Email address</label>
                <input type="text"
                    value="jacksongraham@gmail.com">
            </div>
        </div>

        <div class="input-row">
            <div class="number">5</div>
            <p class="state">Error</p>

            <div class="input-box">
                <label>Email address</label>
                <input class="error" type="text">
                    
                <p> class="error-text">Invalid email format.</p>
            </div>
        </div>

       

    </div>

</body>
</html>
